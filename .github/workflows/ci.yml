name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install asset tooling
        run: python -m pip install -r tools/requirements-assets.txt

      - name: Validate semantic asset selection
        run: python -m pytest tests/test_asset_selection.py -q

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libasound2-dev
          libgl1-mesa-dev
          libglu1-mesa-dev
          libx11-dev
          libxcursor-dev
          libxi-dev
          libxinerama-dev
          libxrandr-dev

      - name: Configure
        run: >-
          cmake -S . -B build/cmake
          -DCMAKE_BUILD_TYPE=Release
          -DJUMPCASTLE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      - name: Test
        run: ctest --test-dir build/cmake -C Release --output-on-failure

      - name: Smoke render biomes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a build/cmake/jumpcastle --smoke-screens build/runtime-smoke
          test -s build/runtime-smoke/courtyard.png
          test -s build/runtime-smoke/frosted-keep.png
          test -s build/runtime-smoke/crown-spire.png

      - name: Verify generated CC0 assets
        run: python tools/verify_assets.py assets/generated/manifest.json

      - name: Prove campaign route
        shell: bash
        run: |
          solver="build/cmake/jumpcastle_solver"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            solver="build/cmake/Release/jumpcastle_solver.exe"
          fi
          "$solver" \
            --level assets/levels/screens \
            --campaign \
            --trace build/campaign-route.json
