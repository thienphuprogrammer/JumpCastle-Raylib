name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libasound2-dev
          libgl1-mesa-dev
          libglu1-mesa-dev
          libx11-dev
          libxcursor-dev
          libxi-dev
          libxinerama-dev
          libxrandr-dev

      - name: Configure
        run: >-
          cmake -S . -B build/cmake
          -DCMAKE_BUILD_TYPE=Release
          -DJUMPCASTLE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      - name: Test
        run: ctest --test-dir build/cmake -C Release --output-on-failure
